# FrontEnd + los tres microservicios en Docker Desktop, conectados a la base de datos
# de Oracle Cloud (Autonomous Database) mediante su wallet. No levanta la base local.
#
#   1. Copiar .env.example a .env y completar los datos de la base.
#   2. Descomprimir el wallet de Oracle Cloud en la carpeta ./wallet (no se sube a git).
#   3. docker compose -f docker-compose.oracle-cloud.yml up -d --build
#
#   FrontEnd:      http://localhost:8084  (pantalla "Conexión con el BackEnd" para el administrador)
#   ms-usuarios:   http://localhost:8081    ms-foro: http://localhost:8082    ms-moderacion: http://localhost:8083
#
# Usa los mismos nombres de contenedor que docker-compose.yml: al levantar uno se reemplazan los del otro.
# Guía completa: docs/ORACLE_CLOUD.md
x-microservicio: &microservicio
  restart: unless-stopped
  environment:
    # /wallet es la carpeta del wallet dentro del contenedor (TNS_ADMIN).
    DB_URL: jdbc:oracle:thin:@${DB_SERVICIO:?Falta DB_SERVICIO en .env}?TNS_ADMIN=/wallet
    DB_USER: ${DB_USER:-FORO}
    DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
  volumes:
    - ${WALLET_DIR:-./wallet}:/wallet:ro

services:
  ms-usuarios:
    <<: *microservicio
    build: ./ms-usuarios
    container_name: foro-ms-usuarios
    ports:
      - "8081:8081"

  ms-foro:
    <<: *microservicio
    build: ./ms-foro
    container_name: foro-ms-foro
    ports:
      - "8082:8082"

  ms-moderacion:
    <<: *microservicio
    build: ./ms-moderacion
    container_name: foro-ms-moderacion
    ports:
      - "8083:8083"

  # El FrontEnd llega a los microservicios por sus nombres de servicio (ver frontend/nginx.conf).
  frontend:
    restart: unless-stopped
    build: ./frontend
    container_name: foro-frontend
    ports:
      - "${FRONTEND_PORT:-8084}:80"
