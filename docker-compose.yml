# Base de datos Oracle para desarrollo local + los tres microservicios + el FrontEnd.
#
#   Solo la base:                     docker compose up -d oracle
#   Base + microservicios + FrontEnd: docker compose --profile apps up -d --build
#
#   FrontEnd:      http://localhost:8084
#   ms-usuarios:   http://localhost:8081    ms-foro: http://localhost:8082    ms-moderacion: http://localhost:8083
#
# Con la base en Oracle Cloud (sin la base local) se usa docker-compose.oracle-cloud.yml.
#
# La primera vez la base tarda ~1 minuto: crea el usuario FORO y ejecuta
# database/02_script_foro.sql (tablas + datos de prueba).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: foro-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Oracle_Duoc_2026      # clave de SYS y SYSTEM
      APP_USER: FORO
      APP_USER_PASSWORD: Foro_Duoc_2026
    volumes:
      - foro-oracle-data:/opt/oracle/oradata
      - ./database:/scripts:ro
      - ./docker/initdb:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ms-usuarios:
    profiles: ["apps"]
    build: ./ms-usuarios
    container_name: foro-ms-usuarios
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: FORO
      DB_PASSWORD: Foro_Duoc_2026
      JWT_SECRET: clave-de-desarrollo-foro-duoc-dsy2205-cambiar-en-produccion
    depends_on:
      oracle:
        condition: service_healthy

  ms-foro:
    profiles: ["apps"]
    build: ./ms-foro
    container_name: foro-ms-foro
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: FORO
      DB_PASSWORD: Foro_Duoc_2026
      JWT_SECRET: clave-de-desarrollo-foro-duoc-dsy2205-cambiar-en-produccion
    depends_on:
      oracle:
        condition: service_healthy

  ms-moderacion:
    profiles: ["apps"]
    build: ./ms-moderacion
    container_name: foro-ms-moderacion
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: FORO
      DB_PASSWORD: Foro_Duoc_2026
      JWT_SECRET: clave-de-desarrollo-foro-duoc-dsy2205-cambiar-en-produccion
    depends_on:
      oracle:
        condition: service_healthy

  # FrontEnd Angular servido con nginx. En esta entrega funciona por separado del BackEnd:
  # maneja la información con arreglos, sin llamar a los microservicios.
  frontend:
    profiles: ["apps"]
    build: ./frontend
    container_name: foro-frontend
    ports:
      - "${FRONTEND_PORT:-8084}:80"

volumes:
  foro-oracle-data:
