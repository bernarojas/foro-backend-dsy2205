server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Pantalla "Conexión con el BackEnd": el navegador pide /servicios/<microservicio>/... y nginx lo
    # pasa al contenedor correspondiente por la red de Docker Compose (/servicios/foro/temas → ms-foro:8082/api/temas).
    # Con variables, nginx resuelve el nombre al momento de la petición: el FrontEnd arranca aunque el BackEnd esté abajo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;

    location ^~ /servicios/usuarios/ {
        set $destino http://ms-usuarios:8081;
        rewrite ^/servicios/usuarios/(.*)$ /api/$1 break;
        proxy_pass $destino;
    }

    location ^~ /servicios/foro/ {
        set $destino http://ms-foro:8082;
        rewrite ^/servicios/foro/(.*)$ /api/$1 break;
        proxy_pass $destino;
    }

    location ^~ /servicios/moderacion/ {
        set $destino http://ms-moderacion:8083;
        rewrite ^/servicios/moderacion/(.*)$ /api/$1 break;
        proxy_pass $destino;
    }

    # Aplicación de una sola página: cualquier ruta (/temas/3, /perfil...) la resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan un hash en el nombre: se pueden guardar en caché.
    location ~* \.(?:js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché, para que una versión nueva se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
