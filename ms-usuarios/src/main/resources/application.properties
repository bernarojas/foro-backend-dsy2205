spring.application.name=ms-usuarios
server.port=${PORT:8081}

# --- Base de datos Oracle -------------------------------------------------
# Local / Docker (Oracle Free):  jdbc:oracle:thin:@//localhost:1521/FREEPDB1
# Oracle Cloud con wallet:       jdbc:oracle:thin:@<servicio>_high?TNS_ADMIN=C:/ruta/al/wallet
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:FORO}
spring.datasource.password=${DB_PASSWORD:Foro_Duoc_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Las tablas las crea database/02_script_foro.sql: JPA no las modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Token de sesión (JWT) -----------------------------------------------
# La misma clave tiene que estar en ms-foro: es la que valida el token.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-foro-duoc-dsy2205-cambiar-en-produccion}
app.jwt.horas=${JWT_HORAS:8}

# Respuestas JSON legibles en Postman
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Santiago
